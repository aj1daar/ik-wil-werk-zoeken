name: Deploy Azure Functions

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - infra/**

permissions:
  id-token: write   # required for OIDC login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (AOT, linux-x64)
        run: dotnet publish backend/backend.csproj -c Release -r linux-x64 --self-contained -o ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment sub create \
            --name infra \
            --location westeurope \
            --template-file infra/main.bicep \
            --parameters \
              resourceGroupName=${{ vars.AZURE_RESOURCE_GROUP }} \
              functionAppName=${{ vars.AZURE_FUNCTION_APP_NAME }} \
              storageAccountName=${{ vars.AZURE_STORAGE_ACCOUNT }}

      - name: Push app secrets to Function App settings
        run: |
          az functionapp config appsettings set \
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --settings \
              APP_PASSWORD="${{ secrets.APP_PASSWORD }}" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: ./publish
          scm-do-build-during-deployment: false
