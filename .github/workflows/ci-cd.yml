name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Lint (parallel) ─────────────────────────────────────────────────────────

  lint-frontend:
    name: Lint / Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run type-check
        working-directory: frontend

  lint-backend:
    name: Lint / Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (debug — fast compile check)
        run: dotnet build backend/backend.csproj -c Debug

  # ── Test (parallel, after respective lint) ───────────────────────────────────

  test-frontend:
    name: Test / Frontend
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend

  test-backend:
    name: Test / Backend
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test backend.Tests/backend.Tests.csproj -c Debug --logger "console;verbosity=normal"

  # ── Build (parallel, after respective tests) ─────────────────────────────────

  build-frontend:
    name: Build / Frontend
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build
        working-directory: frontend
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-backend:
    name: Build / Backend
    needs: test-backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish backend/backend.csproj -c Release -p:PublishAot=false -o ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish
          include-hidden-files: true
          retention-days: 1

  # ── Deploy (parallel, main only, after both builds pass) ─────────────────────

  deploy-frontend:
    name: Deploy / Cloudflare Pages
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create Pages project if not exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages project create ${{ vars.CLOUDFLARE_PAGES_PROJECT }} --production-branch main 2>/dev/null || true
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}

  deploy-backend:
    name: Deploy / Azure Functions
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ./publish
      - name: Verify publish artifact
        run: |
          echo "=== Publish contents ==="
          ls -lh ./publish/
          echo "=== Key files ==="
          ls ./publish/*.dll 2>/dev/null | head -10 || echo "WARNING: no DLLs found"
          ls ./publish/host.json 2>/dev/null || echo "WARNING: host.json missing"
          ls ./publish/functions.metadata 2>/dev/null && echo "functions.metadata present" || echo "WARNING: functions.metadata missing"
          ls ./publish/worker.config.json 2>/dev/null && echo "worker.config.json present" || echo "WARNING: worker.config.json missing"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment sub create \
            --name infra \
            --location westeurope \
            --template-file infra/main.bicep \
            --parameters \
              "resourceGroupName=${{ vars.AZURE_RESOURCE_GROUP }}" \
              "functionAppName=${{ vars.AZURE_FUNCTION_APP_NAME }}" \
              "storageAccountName=${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              "postgresPassword=${{ secrets.POSTGRES_PASSWORD }}"
          echo "=== App settings after Bicep ==="
          az functionapp config appsettings list \
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "[].name" --output tsv
      - name: Push app secrets
        run: |
          az functionapp config appsettings set \
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --settings \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
          echo "=== App settings after secrets push ==="
          az functionapp config appsettings list \
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "[].name" --output tsv
      - name: Run database migrations
        run: |
          dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef
          dotnet restore backend/backend.csproj
          DATABASE_URL="Host=${{ vars.AZURE_FUNCTION_APP_NAME }}-pg.postgres.database.azure.com;Database=iwwz;Username=iwwzadmin;Password=${{ secrets.POSTGRES_PASSWORD }};SSL Mode=Require" \
          dotnet ef database update --project backend --startup-project backend
      - name: Package and deploy
        shell: pwsh
        run: |
          Write-Host "=== Zipping publish output ==="
          Compress-Archive -Path "./publish/*" -DestinationPath "./deploy.zip" -Force
          Write-Host "=== deploy.zip size: $((Get-Item ./deploy.zip).Length / 1MB) MB ==="
          Write-Host "=== Deploying to Azure ==="
          az webapp deploy `
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} `
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} `
            --src-path deploy.zip `
            --type zip `
            --verbose
          Write-Host "=== Restarting function app ==="
          az functionapp restart `
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} `
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          Write-Host "=== Waiting 20s for restart ==="
          Start-Sleep 20
          Write-Host "=== Functions registered after deploy ==="
          az functionapp function list `
            --name ${{ vars.AZURE_FUNCTION_APP_NAME }} `
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} `
            --query "[].name" --output tsv
      - name: Health check
        run: |
          echo "Waiting 30s for cold start..."
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://${{ vars.AZURE_FUNCTION_APP_NAME }}.azurewebsites.net/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"healthcheck@example.com","password":"healthcheck"}')
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "401" ]; then
              echo "Functions are up."
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed — functions still returning $STATUS"
          exit 1
