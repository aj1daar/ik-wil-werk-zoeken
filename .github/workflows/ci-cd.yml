name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Lint (parallel) ─────────────────────────────────────────────────────────

  lint-frontend:
    name: Lint / Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run type-check
        working-directory: frontend

  lint-backend:
    name: Lint / Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (debug — fast compile check)
        run: dotnet build backend/backend.csproj -c Debug

  # ── Test (parallel, after respective lint) ───────────────────────────────────

  test-frontend:
    name: Test / Frontend
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend

  test-backend:
    name: Test / Backend
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test backend.Tests/backend.Tests.csproj -c Debug --logger "console;verbosity=normal"

  # ── Build (parallel, after respective tests) ─────────────────────────────────

  build-frontend:
    name: Build / Frontend
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build
        working-directory: frontend
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-backend:
    name: Build / Backend
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (linux-x64 self-contained)
        run: >
          dotnet publish backend/backend.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -o ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish
          retention-days: 1

  # ── Deploy (parallel, main only, after both builds pass) ─────────────────────

  deploy-frontend:
    name: Deploy / Cloudflare Pages
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create Pages project if not exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages project create ${{ vars.CLOUDFLARE_PAGES_PROJECT }} --production-branch main 2>/dev/null || true
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}

  deploy-backend:
    name: Deploy / Hetzner
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Checked out before the artifact is downloaded — checkout cleans the
      # workspace, which would take ./publish with it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ./publish

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Write environment file on server
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://*:5000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: |
          {
            printf "ASPNETCORE_ENVIRONMENT=%s\n" "$ASPNETCORE_ENVIRONMENT"
            printf "ASPNETCORE_URLS=%s\n" "$ASPNETCORE_URLS"
            printf "DATABASE_URL=%s\n" "$DATABASE_URL"
            printf "JWT_SECRET=%s\n" "$JWT_SECRET"
            printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY"
            printf "RESEND_API_KEY=%s\n" "$RESEND_API_KEY"
            printf "ADMIN_EMAIL=%s\n" "$ADMIN_EMAIL"
            printf "ALLOWED_ORIGIN=%s\n" "$ALLOWED_ORIGIN"
          } | ssh -i ~/.ssh/deploy_key iwwz@${{ secrets.HETZNER_HOST }} "cat > /var/www/iwwz/.env"

      # Migrations run on startup, so the only safe moment for a dump is before
      # the new build goes up. A failing dump fails the deploy on purpose.
      - name: Back up the database
        run: |
          scp -i ~/.ssh/deploy_key scripts/backup-db.sh \
            iwwz@${{ secrets.HETZNER_HOST }}:/var/www/iwwz/backup-db.sh
          ssh -i ~/.ssh/deploy_key iwwz@${{ secrets.HETZNER_HOST }} \
            "chmod +x /var/www/iwwz/backup-db.sh && /var/www/iwwz/backup-db.sh --keep 10"

      - name: Stop service
        run: ssh -i ~/.ssh/deploy_key iwwz@${{ secrets.HETZNER_HOST }} "sudo systemctl stop iwwz || true"

      - name: Upload build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./publish/ \
            iwwz@${{ secrets.HETZNER_HOST }}:/var/www/iwwz/app/

      - name: Start service
        run: |
          ssh -i ~/.ssh/deploy_key iwwz@${{ secrets.HETZNER_HOST }} \
            "chmod +x /var/www/iwwz/app/backend && sudo systemctl start iwwz"

      - name: Health check
        run: |
          echo "Waiting 10s for startup..."
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(ssh -i ~/.ssh/deploy_key iwwz@${{ secrets.HETZNER_HOST }} \
              "curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5000/api/auth/login \
               -H 'Content-Type: application/json' -d '{\"email\":\"h\",\"password\":\"h\"}'")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "401" ]; then
              echo "API is up."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
