# /etc/nginx/snippets/iwwz-proxy.conf
proxy_pass http://127.0.0.1:5000;
proxy_http_version 1.1;
proxy_set_header Host              $host;
# $remote_addr, not $proxy_add_x_forwarded_for: the second one appends to whatever
# the caller sent, and a caller can send anything. real_ip has already replaced
# $remote_addr with the CF-Connecting-IP value, so this header carries exactly one
# address and the backend reads exactly that.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;
