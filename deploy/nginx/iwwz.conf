# /etc/nginx/sites-available/iwwz, symlinked into sites-enabled.
# Cloudflare sits in front of this; nothing else should reach it. ufw only opens
# 80 and 443 to the Cloudflare ranges, and scripts/cf-realip.sh keeps that list
# and /etc/nginx/conf.d/cloudflare-realip.conf in step.
#
# The proxy settings are the same on both ports, so they live in one file,
# /etc/nginx/snippets/iwwz-proxy.conf (deploy/nginx/snippets/iwwz-proxy.conf).
# A header set on one port and forgotten on the other is exactly the kind of
# difference that survives a review.

server {
    listen 80;
    listen [::]:80;
    server_name api.nogoibay.org;

    # The zone is on Full (strict), so Cloudflare always reaches the origin over
    # 443 and nothing legitimate arrives here any more. Kept as a redirect rather
    # than dropped, so a stray plaintext request is answered rather than proxied.
    # This would be a redirect loop on a Flexible zone.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.nogoibay.org;

    # Cloudflare Origin CA. Not publicly trusted, on purpose: it is only good for
    # connections coming from Cloudflare, which is the only thing ufw lets in.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        include snippets/iwwz-proxy.conf;
    }
}

# Anything arriving on an address or a name we do not serve gets no answer at all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    return 444;
}
