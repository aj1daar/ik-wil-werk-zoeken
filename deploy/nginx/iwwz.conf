# /etc/nginx/sites-available/iwwz, symlinked into sites-enabled.
# Cloudflare sits in front of this; nothing else should reach it.
# The Cloudflare ranges and the real_ip_header line come from
# /etc/nginx/conf.d/cloudflare-realip.conf, written by scripts/cf-realip.sh.

server {
    listen 80;
    listen [::]:80;
    server_name api.nogoibay.org;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: the second one appends to
        # whatever the caller sent, and a caller can send anything. real_ip has
        # already replaced $remote_addr with the CF-Connecting-IP value, so this
        # header carries exactly one address and the backend reads exactly that.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# Anything arriving on an address or name we do not serve gets no answer at all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
